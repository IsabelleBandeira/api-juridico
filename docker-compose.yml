services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: juridico-sqlserver
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA}
      MSSQL_PID: ${MSSQL_PID}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${SQLSERVER_PORT}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

  localstack:
    image: localstack/localstack:latest
    container_name: juridico-localstack
    ports:
      - "${LOCALSTACK_PORT}:4566"
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION}
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN}
    volumes:
      - "./scripts:/etc/localstack/init/ready.d"
      - "localstack_data:/var/lib/localstack"

  app:
    build: .
    container_name: juridico-app
    env_file:
      - .env
    environment:
      DATABASE_HOST: sqlserver
    depends_on:
      - sqlserver
    volumes:
      - ./app:/app/app
      - ./api:/app/api
      - ./services:/app/services
      - ./tests:/app/tests
    ports:
      - "8000:8000"

volumes:
  sqlserver_data:
  localstack_data: